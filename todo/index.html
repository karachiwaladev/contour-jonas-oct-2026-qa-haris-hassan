<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Todo</h1>

    <form id="new-task" autocomplete="off">
      <div class="row">
        <input id="task-title" type="text" placeholder="What needs doing?" aria-label="New task" maxlength="200" required>
        <button type="submit">Add</button>
      </div>
      <div class="row extras">
        <label class="field">
          <span>Due</span>
          <input id="task-due" type="date" aria-label="Due date (optional)">
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="task-repeat" aria-label="Repeat">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="task-priority" aria-label="Priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="task-tags" type="text" placeholder="work, urgent" aria-label="Tags, comma-separated (optional)" maxlength="200">
        </label>
      </div>
    </form>

    <div class="filters">
      <input id="search-filter" class="search" type="search" placeholder="Search titles and tags (#tag for tags only)"
        aria-label="Search tasks by title or tag" maxlength="200" autocomplete="off" spellcheck="false">
      <div id="status-filter" class="segmented" role="group" aria-label="Filter by status">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="filter-selects">
        <select id="priority-filter" aria-label="Filter by priority">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="tag-filter" aria-label="Filter by tag"></select>
        <select id="due-filter" aria-label="Filter by due date" autocomplete="off">
          <option value="">Any due date</option>
          <option value="overdue">Overdue</option>
          <option value="today">Due today</option>
          <option value="week">Next 7 days</option>
          <option value="none">No due date</option>
        </select>
      </div>
    </div>

    <p id="error" class="error" role="alert" hidden></p>
    <ul id="task-list"></ul>
    <p id="empty" class="muted">No tasks yet. Add one above.</p>
    <p id="count" class="muted"></p>

    <details id="activity" class="activity">
      <summary id="activity-summary">Activity log</summary>
      <div class="activity-tools">
        <button type="button" id="log-export">Export JSONL</button>
        <button type="button" id="log-clear" class="secondary">Clear log</button>
      </div>
      <p id="activity-empty" class="muted" hidden>No activity yet.</p>
      <ol id="activity-list" class="activity-list"></ol>
    </details>
  </main>

  <script src="recurrence.js"></script>
  <script src="logger.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
